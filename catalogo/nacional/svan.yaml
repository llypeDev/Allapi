escopo: nacional
id: svan
nome: SEFAZ Virtual do Ambiente Nacional (SVAN)
mantenedor: Receita Federal do Brasil
status: em_andamento
notas: >-
  Serviços conferidos contra a Relação de Serviços Web do portal NF-e da SVRS (coleta de 2026-11-10),
  que lista a SVAN nestes endereços em produção e homologação.
  Os endpoints respondem 403 sem certificado digital, por isso o contrato está marcado como restrito.
  Falta confirmar em fonte oficial quais UFs usam a SVAN.
atende:
  - item: documentos_fiscais.nfe
    papel: autorizacao
    ufs: [MA]
    confirmado: false
    nota: Registrado de memória; conferir no Portal NF-e.
servicos:
  - id: svan.nfe.autorizacao
    item: documentos_fiscais.nfe
    nome: NFeAutorizacao
    descricao: Envio de lote de NF-e para autorização
    versao: "4.00"
    protocolo: soap
    autenticacao: certificado_icp
    endpoints:
      - { ambiente: producao, url: "https://www.sefazvirtual.fazenda.gov.br/NFeAutorizacao4/NFeAutorizacao4.asmx", contrato_restrito: true }
      - { ambiente: homologacao, url: "https://hom.sefazvirtual.fazenda.gov.br/NFeAutorizacao4/NFeAutorizacao4.asmx", contrato_restrito: true }
    origem:
      tipo: oficial
      registrado_em: 2026-11-10
      referencias:
        - "https://dfe-portal.svrs.rs.gov.br/Nfe/Servicos"

  - id: svan.nfe.ret_autorizacao
