escopo: nacional
id: svan
nome: SEFAZ Virtual do Ambiente Nacional (SVAN)
mantenedor: Receita Federal do Brasil
status: fechado
notas: >-
  Serviços e relação de UFs conferidos no Portal Nacional da NF-e (coleta de 2026-11-10).
  Os endpoints respondem 403 sem certificado digital, por isso o contrato está marcado como restrito.
atende:
  - item: documentos_fiscais.nfe
    papel: autorizacao
    ufs: [MA]
    confirmado: true
    evidencia:
      url: "https://www.nfe.fazenda.gov.br/portal/webServices.aspx?tipoConteudo=OUC/YVNWZfo="
      consultado_em: 2026-11-10
      nota: "Texto 'UF que utilizam a SVAN - Sefaz Virtual do Ambiente Nacional: MA'."
servicos:
