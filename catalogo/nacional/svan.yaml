escopo: nacional
id: svan
nome: SEFAZ Virtual do Ambiente Nacional (SVAN)
mantenedor: Receita Federal do Brasil
status: em_andamento
notas: >-
  Semente inicial: URLs candidatas registradas de memória.
  A SVAN e a SVC-AN foram unificadas (homologação em 2024, produção em fevereiro de 2025) e os endereços mudaram;
  os hosts abaixo podem estar desatualizados e precisam ser conferidos na relação oficial do Portal NF-e.
atende:
  - item: documentos_fiscais.nfe
    papel: autorizacao
    ufs: [MA]
    confirmado: false
    nota: Registrado de memória; conferir no Portal NF-e.
