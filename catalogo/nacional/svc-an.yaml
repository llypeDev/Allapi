escopo: nacional
id: svc-an
nome: SEFAZ Virtual de Contingência do Ambiente Nacional (SVC-AN)
mantenedor: Receita Federal do Brasil
status: em_andamento
notas: >-
  Serviços e relação de UFs conferidos no Portal Nacional da NF-e (coleta de 2026-11-10).
  Depois da unificação com a SVAN, a SVC-AN atende nos mesmos endereços da SVAN (www.sefazvirtual.fazenda.gov.br).
  O host www.svc.fazenda.gov.br, que circula em material antigo, não resolve mais no DNS.
atende:
  - item: documentos_fiscais.nfe
    papel: contingencia
    ufs: [AC, AL, AP, CE, DF, ES, MG, PA, PB, PI, RJ, RN, RO, RR, RS, SC, SE, SP, TO]
    confirmado: true
    evidencia:
      url: "https://www.nfe.fazenda.gov.br/portal/webServices.aspx?tipoConteudo=OUC/YVNWZfo="
      consultado_em: 2026-11-10
      nota: "Texto 'UF que utilizam a SVC-AN'. A página de homologação diverge: lá o PI aparece na SVC-RS e não na SVC-AN."
servicos:
  - id: svc-an.nfe.autorizacao
    item: documentos_fiscais.nfe
    nome: NFeAutorizacao
    descricao: "Envio de lote de NF-e para autorização"
    versao: "4.00"
    protocolo: soap
    autenticacao: certificado_icp
    endpoints:
      - { ambiente: producao, url: "https://www.sefazvirtual.fazenda.gov.br/NFeAutorizacao4/NFeAutorizacao4.asmx", contrato_restrito: true }
      - { ambiente: homologacao, url: "https://hom.sefazvirtual.fazenda.gov.br/NFeAutorizacao4/NFeAutorizacao4.asmx", contrato_restrito: true }
    origem:
      tipo: oficial
      registrado_em: 2026-11-10
      referencias:
        - "https://www.nfe.fazenda.gov.br/portal/webServices.aspx?tipoConteudo=OUC/YVNWZfo="
        - "https://hom.nfe.fazenda.gov.br/portal/webServices.aspx?tipoConteudo=OUC/YVNWZfo="

