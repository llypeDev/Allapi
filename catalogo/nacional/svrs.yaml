escopo: nacional
id: svrs
nome: SEFAZ Virtual do Rio Grande do Sul (SVRS)
mantenedor: SEFAZ-RS
status: em_andamento
notas: >-
  Semente inicial: todas as URLs abaixo são candidatas, registradas de memória ou de fonte secundária.
  Só contam como confirmadas quando aparecerem numa fonte oficial coletada (ver relatorios/cobertura.md).
  BP-e, NF3e e NFCom também são autorizados aqui; entram quando a página oficial for coletada.
atende:
  - item: documentos_fiscais.nfe
    papel: autorizacao
    ufs: [AC, AL, AP, CE, DF, ES, PA, PB, PI, RJ, RN, RO, RR, SC, SE, TO]
    confirmado: false
    nota: Relação registrada de memória; conferir no Portal NF-e.
  - item: documentos_fiscais.nfce
    papel: autorizacao
    ufs: []
    confirmado: false
    nota: Relação de UFs ainda não levantada.
  - item: documentos_fiscais.cte
    papel: autorizacao
    ufs: []
    confirmado: false
    nota: Relação de UFs ainda não levantada.
  - item: documentos_fiscais.mdfe
    papel: autorizacao
    ufs: [AC, AL, AM, AP, BA, CE, DF, ES, GO, MA, MG, MS, MT, PA, PB, PE, PI, PR, RJ, RN, RO, RR, RS, SC, SE, SP, TO]
    confirmado: false
    nota: O MDF-e tem autorizador único nacional; conferir no portal do MDF-e.
  - item: cadastro.consulta_cadastro
    ufs: []
    confirmado: false
    nota: Relação de UFs ainda não levantada.
