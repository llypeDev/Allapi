escopo: nacional
id: svrs
nome: SEFAZ Virtual do Rio Grande do Sul (SVRS)
mantenedor: SEFAZ-RS
status: em_andamento
notas: >-
  Serviços conferidos contra as páginas Relação de Serviços Web do portal DFe da SVRS (coleta de 2026-11-10).
  Os endpoints SOAP respondem 403 sem certificado digital, por isso o contrato está marcado como restrito.
  Falta confirmar em fonte oficial quais UFs usam a SVRS em cada documento.
atende:
  - item: documentos_fiscais.nfe
    papel: autorizacao
    ufs: [AC, AL, AP, CE, DF, ES, PA, PB, PI, RJ, RN, RO, RR, SC, SE, TO]
    confirmado: false
    nota: Relação registrada de memória; conferir no Portal Nacional da NF-e.
  - item: documentos_fiscais.nfce
    papel: autorizacao
    ufs: []
    confirmado: false
    nota: Relação de UFs ainda não levantada.
  - item: documentos_fiscais.cte
    papel: autorizacao
    ufs: []
    confirmado: false
    nota: Relação de UFs ainda não levantada.
  - item: documentos_fiscais.mdfe
    papel: autorizacao
    ufs: [AC, AL, AM, AP, BA, CE, DF, ES, GO, MA, MG, MS, MT, PA, PB, PE, PI, PR, RJ, RN, RO, RR, RS, SC, SE, SP, TO]
    confirmado: false
    nota: A relação oficial lista a SVRS como único autorizador (Ambiente Nacional); falta a evidência explícita da abrangência.
  - item: documentos_fiscais.bpe
    papel: autorizacao
    ufs: []
    confirmado: false
    nota: Relação de UFs ainda não levantada.
  - item: documentos_fiscais.nf3e
    papel: autorizacao
    ufs: []
    confirmado: false
    nota: Relação de UFs ainda não levantada.
