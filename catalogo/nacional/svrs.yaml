escopo: nacional
id: svrs
nome: SEFAZ Virtual do Rio Grande do Sul (SVRS)
mantenedor: SEFAZ-RS
status: em_andamento
notas: >-
  Serviços conferidos contra as páginas Relação de Serviços Web do portal DFe da SVRS (coleta de 2026-11-10).
  Os endpoints SOAP respondem 403 sem certificado digital, por isso o contrato está marcado como restrito.
  Falta fonte oficial para a relação de UFs que usam a SVRS em NFC-e, BP-e, NF3e e NFCom.
atende:
  - item: documentos_fiscais.nfe
    papel: autorizacao
    ufs: [AC, AL, AP, CE, DF, ES, PA, PB, PI, RJ, RN, RO, RR, SC, SE, TO]
    confirmado: true
    evidencia:
      url: "https://www.nfe.fazenda.gov.br/portal/webServices.aspx?tipoConteudo=OUC/YVNWZfo="
      consultado_em: 2026-11-10
      nota: "Texto 'UF que utilizam a SVRS - Para demais serviços relacionados com o sistema da NF-e'."
  - item: cadastro.consulta_cadastro
    ufs: [AC, ES, PB, RN, SC]
    confirmado: true
    evidencia:
      url: "https://www.nfe.fazenda.gov.br/portal/webServices.aspx?tipoConteudo=OUC/YVNWZfo="
      consultado_em: 2026-11-10
      nota: "Texto 'UF que utilizam a SVRS - Para serviço de Consulta Cadastro'."
  - item: documentos_fiscais.cte
    papel: autorizacao
    ufs: [AC, AL, AM, BA, CE, DF, ES, GO, MA, PA, PB, PI, RJ, RN, RO, SC, SE, TO]
    confirmado: true
    evidencia:
      url: "https://www.cte.fazenda.gov.br/portal/webServices.aspx"
      consultado_em: 2026-11-10
      nota: "Texto 'Estados que utilizam a SVRS - Sefaz Virtual do RS'."
  - item: documentos_fiscais.cte
    papel: contingencia
    ufs: [AP, MS, MT, PE, RR, SP]
    confirmado: true
    evidencia:
      url: "https://www.cte.fazenda.gov.br/portal/webServices.aspx"
      consultado_em: 2026-11-10
      nota: "Texto 'Estados que devem utilizar a SVC-RS: aqueles que autorizam na SVSP, MT, MS, SP'. A SVC-RS do CT-e usa os mesmos endereços da SVRS."
  - item: documentos_fiscais.mdfe
    papel: autorizacao
    ufs: [AC, AL, AM, AP, BA, CE, DF, ES, GO, MA, MG, MS, MT, PA, PB, PE, PI, PR, RJ, RN, RO, RR, RS, SC, SE, SP, TO]
    confirmado: true
    evidencia:
      url: "https://dfe-portal.svrs.rs.gov.br/Mdfe/Servicos"
      consultado_em: 2026-11-10
      nota: "A relação lista um único autorizador, em produção e homologação: 'SVRS (Ambiente Nacional)'."
  - item: documentos_fiscais.nfce
    papel: autorizacao
    ufs: []
    confirmado: false
    nota: "A página oficial lista autorizadores próprios em AM, GO, MS, MT, PR, RS e SP, mas não diz quais UFs usam a SVRS."
  - item: documentos_fiscais.bpe
    papel: autorizacao
    ufs: []
    confirmado: false
    nota: "A página oficial lista autorizadores próprios em MG, MS, MT, PR e SP, mas não diz quais UFs usam a SVRS."
  - item: documentos_fiscais.nf3e
    papel: autorizacao
    ufs: []
    confirmado: false
    nota: "A página oficial lista autorizadores próprios em MG, MS, MT e PR, mas não diz quais UFs usam a SVRS."
  - item: documentos_fiscais.nfcom
    papel: autorizacao
    ufs: []
    confirmado: false
    nota: "A página oficial lista autorizadores próprios em MG, MS e MT, mas não diz quais UFs usam a SVRS."
