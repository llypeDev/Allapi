escopo: nacional
id: svsp
nome: SEFAZ Virtual de São Paulo (SVSP)
mantenedor: SEFAZ-SP
status: em_andamento
notas: >-
  Ambiente da SEFAZ-SP que autoriza CT-e para outras UFs e serve de contingência (SVC-SP).
  Conferido no portal DFe da SVRS e no Portal Nacional do CT-e (coleta de 2026-11-10).
  Compartilha o host com os serviços próprios de São Paulo, que entram no arquivo do estado.
atende:
  - item: documentos_fiscais.cte
    papel: autorizacao
    ufs: [AP, PE, RR]
    confirmado: true
    evidencia:
      url: "https://www.cte.fazenda.gov.br/portal/webServices.aspx"
      consultado_em: 2026-11-10
      nota: "Texto 'Estados que utilizam a SVSP - Sefaz Virtual de São Paulo: AP, PE, RR'."
  - item: documentos_fiscais.cte
    papel: contingencia
    ufs: [AC, AL, AM, BA, CE, DF, ES, GO, MA, MG, PA, PB, PI, PR, RJ, RN, RO, RS, SC, SE, TO]
    confirmado: true
    evidencia:
      url: "https://www.cte.fazenda.gov.br/portal/webServices.aspx"
      consultado_em: 2026-11-10
      nota: "Texto 'Estados que devem utilizar a SVC-SP: aqueles que autorizam na SVRS, MG, PR, RS'. A SVC-SP usa os mesmos endereços da SVSP."
servicos:
