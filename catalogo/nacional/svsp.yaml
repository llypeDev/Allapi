    nome: CTeRecepcaoSincV4
    descricao: "Autorização síncrona de CT-e"
    versao: "4.00"
    protocolo: soap
    autenticacao: certificado_icp
    endpoints:
      - { ambiente: producao, url: "https://nfe.fazenda.sp.gov.br/CTeWS/WS/CTeRecepcaoSincV4.asmx" }
      - { ambiente: homologacao, url: "https://homologacao.nfe.fazenda.sp.gov.br/CTeWS/WS/CTeRecepcaoSincV4.asmx" }
    origem:
      tipo: oficial
      registrado_em: 2026-11-10
