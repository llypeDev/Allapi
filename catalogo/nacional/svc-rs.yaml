escopo: nacional
id: svc-rs
nome: SEFAZ Virtual de Contingência do Rio Grande do Sul (SVC-RS)
mantenedor: SEFAZ-RS
status: em_andamento
notas: >-
  Semente inicial: URLs candidatas registradas de memória.
  Supõe-se que a contingência SVC-RS use os mesmos endereços da SVRS. Esses endereços constam na fonte oficial
  como SVRS, o que não prova o uso em contingência: confirmar no Portal Nacional da NF-e.
atende:
  - item: documentos_fiscais.nfe
    papel: contingencia
    ufs: [AM, BA, GO, MA, MS, MT, PE, PR]
    confirmado: false
    nota: Registrado de memória; conferir no Portal NF-e.
servicos:
  - id: svc-rs.nfe.autorizacao
    item: documentos_fiscais.nfe
    nome: NFeAutorizacao
    descricao: Envio de lote de NF-e para autorização
    versao: "4.00"
    protocolo: soap
    autenticacao: certificado_icp
    endpoints:
      - { ambiente: producao, url: "https://nfe.svrs.rs.gov.br/ws/NfeAutorizacao/NFeAutorizacao4.asmx", contrato_restrito: true }
      - { ambiente: homologacao, url: "https://nfe-homologacao.svrs.rs.gov.br/ws/NfeAutorizacao/NFeAutorizacao4.asmx", contrato_restrito: true }
    origem:
      tipo: memoria
      registrado_em: 2026-11-10

  - id: svc-rs.nfe.ret_autorizacao
    item: documentos_fiscais.nfe
    nome: NFeRetAutorizacao
    descricao: Consulta do resultado do lote enviado
    versao: "4.00"
    protocolo: soap
    autenticacao: certificado_icp
