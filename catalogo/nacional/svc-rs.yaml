    nome: NfeConsultaProtocolo
    descricao: Consulta da situação de uma NF-e pela chave
    versao: "4.00"
    protocolo: soap
    autenticacao: certificado_icp
    endpoints:
      - { ambiente: producao, url: "https://nfe.svrs.rs.gov.br/ws/NfeConsulta/NfeConsulta4.asmx", contrato_restrito: true }
      - { ambiente: homologacao, url: "https://nfe-homologacao.svrs.rs.gov.br/ws/NfeConsulta/NfeConsulta4.asmx", contrato_restrito: true }
    origem:
