escopo: nacional
id: svc-rs
nome: SEFAZ Virtual de Contingência do Rio Grande do Sul (SVC-RS)
mantenedor: SEFAZ-RS
status: em_andamento
notas: >-
  Serviços e relação de UFs conferidos no Portal Nacional da NF-e (coleta de 2026-11-10).
  A SVC-RS da NF-e atende nos mesmos endereços da SVRS e não oferece inutilização.
  A contingência do CT-e pela SVC-RS está registrada no arquivo da SVRS.
atende:
  - item: documentos_fiscais.nfe
    papel: contingencia
    ufs: [AM, BA, GO, MA, MS, MT, PE, PR]
    confirmado: true
    evidencia:
      url: "https://www.nfe.fazenda.gov.br/portal/webServices.aspx?tipoConteudo=OUC/YVNWZfo="
      consultado_em: 2026-11-10
      nota: "Texto 'UF que utilizam a SVC-RS'. A página de homologação diverge: lá o PI também aparece na SVC-RS."
servicos:
  - id: svc-rs.nfe.autorizacao
    item: documentos_fiscais.nfe
    nome: NFeAutorizacao
    descricao: "Envio de lote de NF-e para autorização"
    versao: "4.00"
    protocolo: soap
    autenticacao: certificado_icp
    endpoints:
      - { ambiente: producao, url: "https://nfe.svrs.rs.gov.br/ws/NfeAutorizacao/NFeAutorizacao4.asmx", contrato_restrito: true }
      - { ambiente: homologacao, url: "https://nfe-homologacao.svrs.rs.gov.br/ws/NfeAutorizacao/NFeAutorizacao4.asmx", contrato_restrito: true }
    origem:
      tipo: oficial
      registrado_em: 2026-11-10
      referencias:
        - "https://www.nfe.fazenda.gov.br/portal/webServices.aspx?tipoConteudo=OUC/YVNWZfo="
        - "https://hom.nfe.fazenda.gov.br/portal/webServices.aspx?tipoConteudo=OUC/YVNWZfo="

